name: CI

on:
  push:
    paths:
      - '!.opencode/**'
  pull_request:
    branches:
      - master

jobs:
  test:
    permissions:
      checks: write
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Display PowerShell version
      shell: pwsh
      run: $PSVersionTable

    - name: Install Required Modules
      shell: pwsh
      run: |
        Set-PSRepository PSGallery -InstallationPolicy Trusted
        Install-Module -Name Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0 -ErrorAction Stop
        Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

    - name: Run Pester
      shell: pwsh
      run: |
        Import-Module -Name Pester
        $config = [PesterConfiguration]::Default
        $config.Run.Path = 'tests'
        $config.TestResult.Enabled = $true
        $config.TestResult.OutputFormat = 'NUnitXml'
        $config.TestResult.OutputPath = 'test-results.xml'
        Invoke-Pester -Configuration $config

    - name: Run PSScriptAnalyzer
      shell: pwsh
      run: |
        ./tools/lint.ps1 -Mode github

    - name: Upload Test Results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results.xml
