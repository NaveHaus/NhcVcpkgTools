name: CI

on:
  push:
    paths:
      - '!.opencode/**'
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    permissions:
      checks: write
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Display PowerShell version
      shell: pwsh
      run: $PSVersionTable

    - name: Resolve Dependencies
      shell: pwsh
      run: |
        ./build.ps1 -ResolveDependency -Tasks noop

    - name: Build NhcVcpkgTools
      shell: pwsh
      run: |
        ./build.ps1 -Tasks build

    - name: Execute Tests
      shell: pwsh
      run: |
        ./build.ps1 -Tasks test

    - name: Upload Test Results
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: test-results
        path: output/testResults/NUnitXml_NhcVcpkgTools_*

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Display PowerShell version
      shell: pwsh
      run: $PSVersionTable

    - name: Run PSScriptAnalyzer
      shell: pwsh
      run: |
        ./tools/lint.ps1 -Mode github