schema: spec-driven-with-adr

context: |
  - Tech stack: PowerShell 7, Pester, PSScriptAnalyzer, ModuleBuilder, ChangelogManagement
  - MANDATORY skill usage:
    - Use the 'exa-code-search' skill to search for public code examples, API syntax, library documentation, or debugging help
    - Use the 'powershell-expert' skill when writing or refactoring PowerShell scripts to enforce modern, safe, and idiomatic practices
    - Use the 'using-git-worktrees' skill to start isolated work
    - Invoke the 'openspec-git-discipline' skill during any workflow in which proposal artifacts, branches, merges, or archive timing affect git history
    - Use the 'conventional-commit' skill to generate `git commit` messages

rules:
  proposal:
    - "MANDATORY: Invoke the 'openspec-plus-proposal' skill BEFORE writing the proposal"
    - "MANDATORY: Use the 'glossary' skill to ensure consistent artifact wording"
  design:
    - "MANDATORY: Invoke the 'openspec-plus-design' skill BEFORE writing the design document"
    - "MANDATORY: Use the 'glossary' skill to ensure consistent artifact wording"
    - "MANDATORY: Use the 'c4-diagrams' and 'mermaid-diagrams' skills when creating visual representations"
  adr:
    - "MANDATORY: Use the 'architecture-decision-records' skill"
    - "MANDATORY: Use the 'glossary' skill to ensure consistent artifact wording"
  specs:
    - "MANDATORY: Invoke the 'openspec-plus-spec' skill BEFORE writing any specification"
    - "MANDATORY: Use the 'glossary' skill to ensure consistent artifact wording"
  tasks:
    - "MANDATORY: Invoke the 'openspec-plus-tasks' skill BEFORE writing the tasks file"
    - "MANDATORY: Use the 'glossary' skill to ensure consistent artifact wording"

operations:
  apply:
    guidance:
      - "MANDATORY: Use the 'openspec-plus-apply' skill"
      - "MANDATORY: Use the 'openspec-plus-tdd' skill for writing tests"
  archive:
    guidance:
      - "MANDATORY: Invoke 'openspec-sync-specs' BEFORE archiving"